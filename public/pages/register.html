<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | FRET STORE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="navbar"></div>

    <main>
        <div class="auth-page-wrapper">
            <div class="auth-card">
                <div class="auth-header">
                    <h1 class="auth-title">CREATE ACCOUNT</h1>
                    <p class="auth-subtitle">Join Fret Store for seamless checkout and order tracking</p>
                </div>

                <div id="register-alert" class="alert alert-error" style="display: none;"></div>
                <div id="register-success" class="alert alert-success" style="display: none;"></div>

                <form id="register-form" novalidate>
                    <div class="form-group">
                        <label for="reg-username" class="form-label">Username</label>
                        <input 
                            type="text" 
                            id="reg-username" 
                            class="form-input" 
                            placeholder="fretdev" 
                            required 
                            autocomplete="username"
                        >
                        <div class="form-error" id="username-error"></div>
                    </div>

                    <div class="form-group">
                        <label for="reg-email" class="form-label">Email Address</label>
                        <input 
                            type="email" 
                            id="reg-email" 
                            class="form-input" 
                            placeholder="name@example.com" 
                            required 
                            autocomplete="email"
                        >
                        <div class="form-error" id="email-error"></div>
                    </div>

                    <div class="form-group">
                        <label for="reg-password" class="form-label">Password (min. 8 characters)</label>
                        <input 
                            type="password" 
                            id="reg-password" 
                            class="form-input" 
                            placeholder="••••••••" 
                            required 
                            autocomplete="new-password"
                        >
                        <div class="form-error" id="password-error"></div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg" id="reg-submit-btn">
                        REGISTER ACCOUNT
                    </button>
                </form>

                <div class="auth-footer">
                    Already have an account? <a href="/pages/login.html" class="auth-link">Sign In</a>
                </div>
            </div>
        </div>
    </main>

    <div id="footer"></div>

    <script type="module" src="/js/components.js"></script>
    <script type="module" src="/js/register.js"></script>
</body>
</html>
