<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h1 class="form-heading">WELCOME TO FRET STORE</h1>
        <form action="" class="login-form">
            <div class="form-inputs">
                <label for="username">Username:
                <input type="text" placeholder="Enter username" name="username" class="username">
            </label>
            <label for="password">
                Password:
                <input type="password" placeholder="Enter password" name="password" class="password">
            </label>
            </div>
            <button type="submit" class="submit-btn">Submit</button>
        </form>
            <span class="status-display"></span>
    </div>
    <script src="index.js"></script>
</body>
</html>
